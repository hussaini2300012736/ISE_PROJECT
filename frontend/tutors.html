<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tutors — TutorBook</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        :root {
            --primary: #1a1a2e;
            --accent: #e94560;
            --light: #f5f5f0;
            --muted: #6c757d;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'DM Sans', sans-serif;
            background: var(--light);
            color: var(--primary);
        }

        nav {
            background: var(--primary);
            padding: 1.2rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .nav-logo {
            font-family: 'Playfair Display', serif;
            color: white;
            font-size: 1.5rem;
            text-decoration: none;
        }

        .nav-logo span { color: var(--accent); }

        .nav-links a {
            color: rgba(255,255,255,0.75);
            text-decoration: none;
            margin-left: 2rem;
            font-size: 0.95rem;
            font-weight: 500;
            transition: color 0.2s;
        }

        .nav-links a:hover, .nav-links a.active { color: white; }

        .nav-links .btn-nav {
            background: var(--accent);
            color: white;
            padding: 0.5rem 1.3rem;
            border-radius: 50px;
        }

        .page-header {
            background: var(--primary);
            padding: 3rem 3rem 4rem;
            position: relative;
            overflow: hidden;
        }

        .page-header::before {
            content: '';
            position: absolute;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(233,69,96,0.15) 0%, transparent 70%);
            top: -100px;
            right: 0;
            border-radius: 50%;
        }

        .page-header h1 {
            font-family: 'Playfair Display', serif;
            color: white;
            font-size: 2.5rem;
            position: relative;
        }

        .page-header p {
            color: rgba(255,255,255,0.5);
            margin-top: 0.5rem;
            position: relative;
        }

        .main-content {
            padding: 2.5rem 3rem;
            max-width: 1200px;
            margin: 0 auto;
        }

        .section-card {
            background: white;
            border-radius: 16px;
            padding: 2rem;
            margin-bottom: 2rem;
            border: 1px solid #eee;
        }

        .section-card h3 {
            font-family: 'Playfair Display', serif;
            font-size: 1.4rem;
            margin-bottom: 1.5rem;
            color: var(--primary);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .section-card h3 i { color: var(--accent); }

        #tutorList {
            list-style: none;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1rem;
            margin-top: 1rem;
        }

        #tutorList li {
            background: var(--light);
            border-radius: 12px;
            padding: 1.2rem 1.5rem;
            border: 1px solid #eee;
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.8rem;
        }

        .tutor-info {
            display: flex;
            align-items: center;
            gap: 0.8rem;
        }

        .tutor-info::before {
            content: '👤';
            font-size: 1.2rem;
        }

        .btn-delete {
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 0.4rem 0.9rem;
            font-size: 0.8rem;
            font-family: 'DM Sans', sans-serif;
            cursor: pointer;
            transition: all 0.2s;
            flex-shrink: 0;
        }

        .btn-delete:hover {
            background: #c73652;
            transform: translateY(-1px);
        }

        .form-row {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            margin-bottom: 1rem;
        }

        input {
            flex: 1;
            min-width: 150px;
            padding: 0.8rem 1rem;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-family: 'DM Sans', sans-serif;
            font-size: 0.9rem;
            color: var(--primary);
            background: var(--light);
            transition: border-color 0.2s;
            outline: none;
        }

        input:focus {
            border-color: var(--accent);
            background: white;
        }

        .btn {
            padding: 0.8rem 1.8rem;
            border: none;
            border-radius: 10px;
            font-family: 'DM Sans', sans-serif;
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-primary {
            background: var(--accent);
            color: white;
        }

        .btn-primary:hover {
            background: #c73652;
            transform: translateY(-1px);
        }

        .btn-secondary {
            background: var(--primary);
            color: white;
        }

        .btn-secondary:hover {
            background: #2d2d4e;
            transform: translateY(-1px);
        }

        .btn-outline {
            background: transparent;
            color: var(--primary);
            border: 1px solid #ddd;
        }

        .btn-outline:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        #bookingList {
            list-style: none;
        }

        #bookingList li {
            background: var(--light);
            border-radius: 12px;
            padding: 1rem 1.5rem;
            margin-bottom: 0.8rem;
            border-left: 3px solid var(--accent);
            font-size: 0.9rem;
            color: var(--primary);
        }

        .alert {
            padding: 0.8rem 1rem;
            border-radius: 10px;
            font-size: 0.9rem;
            margin-top: 0.5rem;
            display: none;
        }

        .alert-success { background: #d4edda; color: #155724; }
        .alert-error { background: #f8d7da; color: #721c24; }
    </style>
</head>
<body>

    <nav>
        <a href="index.html" class="nav-logo">Tutor<span>Book</span></a>
        <div class="nav-links">
            <a href="tutors.html" class="active">Tutors</a>
            <a href="booking.html">Book</a>
            <a href="payment.html">Payment</a>
            <a href="login.html" class="btn-nav">Login</a>
        </div>
    </nav>

    <div class="page-header">
        <h1>Tutors & Bookings</h1>
        <p>Manage tutors, make bookings, and view your sessions</p>
    </div>

    <div class="main-content">

        <div class="section-card">
            <h3><i class="bi bi-people"></i> Available Tutors</h3>
            <button class="btn btn-outline" onclick="loadTutors()">
                <i class="bi bi-arrow-clockwise"></i> Load Tutors
            </button>
            <ul id="tutorList"></ul>
        </div>

        <div class="section-card">
            <h3><i class="bi bi-person-plus"></i> Add Tutor</h3>
            <div class="form-row">
                <input id="name" placeholder="Full Name">
                <input id="subject" placeholder="Subject (e.g. Math)">
                <input id="price" placeholder="Price per hour (e.g. 50)">
            </div>
            <button class="btn btn-secondary" onclick="addTutor()">Add Tutor</button>
        </div>

        <div class="section-card">
            <h3><i class="bi bi-calendar-plus"></i> Book a Tutor</h3>
            <div class="form-row">
                <input id="student_name" placeholder="Your Name">
                <input id="tutor_id" placeholder="Tutor ID">
                <input id="date" type="date">
                <input id="time" placeholder="Time (e.g. 14:00)">
            </div>
            <button class="btn btn-primary" onclick="bookTutor()">Confirm Booking</button>
            <div id="bookingAlert" class="alert"></div>
        </div>

        <div class="section-card">
            <h3><i class="bi bi-list-check"></i> My Bookings</h3>
            <button class="btn btn-outline" onclick="loadBookings()">
                <i class="bi bi-eye"></i> Show Bookings
            </button>
            <ul id="bookingList" style="margin-top: 1rem;"></ul>
        </div>

    </div>

    <script>
    function loadTutors() {
        fetch("http://127.0.0.1:5000/tutors")
            .then(response => response.json())
            .then(data => {
                let list = document.getElementById("tutorList");
                list.innerHTML = "";
                data.forEach(tutor => {
                    let li = document.createElement("li");

                    let info = document.createElement("span");
                    info.className = "tutor-info";
                    info.textContent = `${tutor[1]} — ${tutor[2]} — $${tutor[3]}/hr (ID: ${tutor[0]})`;

                    let btn = document.createElement("button");
                    btn.className = "btn-delete";
                    btn.textContent = "Delete";
                    btn.onclick = () => deleteTutor(tutor[0]);

                    li.appendChild(info);
                    li.appendChild(btn);
                    list.appendChild(li);
                });
            });
    }

    function deleteTutor(id) {
        fetch(`http://127.0.0.1:5000/tutors/${id}`, {
            method: "DELETE"
        }).then(() => loadTutors());
    }

    function addTutor() {
        fetch("http://127.0.0.1:5000/tutors", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({
                name: document.getElementById("name").value,
                subject: document.getElementById("subject").value,
                price: document.getElementById("price").value
            })
        }).then(() => loadTutors());
    }

    function bookTutor() {
        fetch("http://127.0.0.1:5000/book", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({
                student_name: document.getElementById("student_name").value,
                tutor_id: document.getElementById("tutor_id").value,
                date: document.getElementById("date").value,
                time: document.getElementById("time").value
            })
        })
        .then(res => res.json())
        .then(data => {
            let alert = document.getElementById("bookingAlert");
            alert.style.display = "block";
            if (data.message) {
                alert.className = "alert alert-success";
                alert.textContent = "✓ " + data.message;
            } else {
                alert.className = "alert alert-error";
                alert.textContent = "✗ " + (data.error || "Something went wrong");
            }
        });
    }

    function loadBookings() {
        fetch("http://127.0.0.1:5000/bookings")
            .then(res => res.json())
            .then(data => {
                let list = document.getElementById("bookingList");
                list.innerHTML = "";
                if (data.length === 0) {
                    list.innerHTML = '<li style="border-left: 3px solid #ddd; color: #999;">No bookings found.</li>';
                    return;
                }
                data.forEach(b => {
                    let li = document.createElement("li");
                    li.textContent = `${b[1]} booked tutor #${b[2]} on ${b[3]} at ${b[4]} — status: ${b[5]}`;
                    list.appendChild(li);
                });
            });
    }
    </script>

</body>
</html>
