<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard — TutorBook</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        :root {
            --primary: #1a1a2e;
            --accent: #e94560;
            --light: #f5f5f0;
            --muted: #6c757d;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'DM Sans', sans-serif;
            background: var(--light);
            color: var(--primary);
        }

        nav {
            background: var(--primary);
            padding: 1.2rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .nav-logo {
            font-family: 'Playfair Display', serif;
            color: white;
            font-size: 1.5rem;
            text-decoration: none;
        }

        .nav-logo span { color: var(--accent); }

        .nav-links a {
            color: rgba(255,255,255,0.75);
            text-decoration: none;
            margin-left: 2rem;
            font-size: 0.95rem;
            font-weight: 500;
            transition: color 0.2s;
        }

        .nav-links a:hover { color: white; }

        .nav-links .btn-nav {
            background: var(--accent);
            color: white;
            padding: 0.5rem 1.3rem;
            border-radius: 50px;
        }

        .page-header {
            background: var(--primary);
            padding: 3rem 3rem 4rem;
            position: relative;
            overflow: hidden;
        }

        .page-header::before {
            content: '';
            position: absolute;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(233,69,96,0.15) 0%, transparent 70%);
            top: -100px;
            right: 0;
            border-radius: 50%;
        }

        .page-header h1 {
            font-family: 'Playfair Display', serif;
            color: white;
            font-size: 2.5rem;
            position: relative;
        }

        .page-header p {
            color: rgba(255,255,255,0.5);
            margin-top: 0.5rem;
            position: relative;
        }

        .main-content {
            padding: 2.5rem 3rem;
            max-width: 1100px;
            margin: 0 auto;
        }

        .stats-row {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .stat-card {
            background: white;
            border-radius: 16px;
            padding: 1.8rem;
            border: 1px solid #eee;
            display: flex;
            align-items: center;
            gap: 1.2rem;
        }

        .stat-icon {
            width: 50px;
            height: 50px;
            border-radius: 12px;
            background: rgba(233,69,96,0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3rem;
            color: var(--accent);
            flex-shrink: 0;
        }

        .stat-card h4 {
            font-family: 'Playfair Display', serif;
            font-size: 1.8rem;
            color: var(--primary);
        }

        .stat-card p { color: var(--muted); font-size: 0.85rem; }

        .section-card {
            background: white;
            border-radius: 16px;
            padding: 2rem;
            margin-bottom: 2rem;
            border: 1px solid #eee;
        }

        .section-card h3 {
            font-family: 'Playfair Display', serif;
            font-size: 1.4rem;
            margin-bottom: 1.5rem;
            color: var(--primary);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .section-card h3 i { color: var(--accent); }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9rem;
        }

        th {
            text-align: left;
            padding: 0.8rem 1rem;
            color: var(--muted);
            font-weight: 500;
            border-bottom: 1px solid #eee;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        td {
            padding: 1rem;
            border-bottom: 1px solid #f5f5f0;
            color: var(--primary);
        }

        tr:last-child td { border-bottom: none; }
        tr:hover td { background: var(--light); }

        .badge {
            display: inline-block;
            padding: 0.3rem 0.8rem;
            border-radius: 50px;
            font-size: 0.75rem;
            font-weight: 500;
        }

        .badge-pending { background: #fff3cd; color: #856404; }
        .badge-approved { background: #d4edda; color: #155724; }

        .btn {
            padding: 0.5rem 1.2rem;
            border: none;
            border-radius: 8px;
            font-family: 'DM Sans', sans-serif;
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }

        .form-row {
            display: flex;
            gap: 1rem;
            align-items: center;
        }

        input {
            flex: 1;
            padding: 0.8rem 1rem;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-family: 'DM Sans', sans-serif;
            font-size: 0.9rem;
            background: var(--light);
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus { border-color: var(--accent); background: white; }

        .btn-primary {
            background: var(--accent);
            color: white;
            padding: 0.8rem 1.8rem;
            border-radius: 10px;
            border: none;
            cursor: pointer;
            font-family: 'DM Sans', sans-serif;
            font-weight: 500;
        }

        .btn-primary:hover { background: #c73652; }

        .alert {
            padding: 0.8rem 1rem;
            border-radius: 10px;
            font-size: 0.9rem;
            margin-top: 1rem;
            display: none;
        }

        .alert-success { background: #d4edda; color: #155724; }

        .welcome-banner {
            background: var(--primary);
            border-radius: 16px;
            padding: 2rem;
            margin-bottom: 2rem;
            display: flex;
            align-items: center;
            gap: 1.5rem;
            position: relative;
            overflow: hidden;
        }

        .welcome-banner::before {
            content: '';
            position: absolute;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(233,69,96,0.2) 0%, transparent 70%);
            right: -50px;
            top: -50px;
            border-radius: 50%;
        }

        .welcome-banner img {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            border: 3px solid var(--accent);
            position: relative;
            z-index: 1;
        }

        .welcome-banner .welcome-text {
            position: relative;
            z-index: 1;
        }

        .welcome-banner h2 {
            font-family: 'Playfair Display', serif;
            color: white;
            font-size: 1.5rem;
        }

        .welcome-banner p {
            color: rgba(255,255,255,0.5);
            font-size: 0.9rem;
            margin-top: 0.2rem;
        }
    </style>
</head>
<body>

    <nav>
        <a href="/" class="nav-logo">Tutor<span>Book</span></a>
        <div class="nav-links" id="navLinks">Loading...</div>
    </nav>

    <div class="page-header">
        <h1>Dashboard</h1>
        <p>Manage bookings and approve offline payments</p>
    </div>

    <div class="main-content">

        <!-- WELCOME BANNER -->
        <div class="welcome-banner" id="welcomeBanner" style="display:none;">
            <img id="userAvatar" src="" alt="avatar">
            <div class="welcome-text">
                <h2 id="welcomeName">Welcome back!</h2>
                <p id="welcomeEmail"></p>
            </div>
        </div>

        <!-- STATS -->
        <div class="stats-row">
            <div class="stat-card">
                <div class="stat-icon"><i class="bi bi-calendar-check"></i></div>
                <div>
                    <h4 id="totalBookings">—</h4>
                    <p>Total Bookings</p>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon"><i class="bi bi-clock-history"></i></div>
                <div>
                    <h4 id="pendingCount">—</h4>
                    <p>Pending Payments</p>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon"><i class="bi bi-check-circle"></i></div>
                <div>
                    <h4 id="approvedCount">—</h4>
                    <p>Approved</p>
                </div>
            </div>
        </div>

        <!-- BOOKINGS TABLE -->
        <div class="section-card">
            <h3><i class="bi bi-list-ul"></i> All Bookings</h3>
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Student</th>
                        <th>Tutor ID</th>
                        <th>Date</th>
                        <th>Time</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody id="bookingsTable">
                    <tr><td colspan="6" style="color: #999; text-align: center;">Loading bookings...</td></tr>
                </tbody>
            </table>
        </div>

        <!-- APPROVE OFFLINE PAYMENT -->
        <div class="section-card">
            <h3><i class="bi bi-cash-coin"></i> Approve Offline Payment</h3>
            <div class="form-row">
                <input id="booking_id" placeholder="Enter Booking ID to approve" type="number">
                <button class="btn btn-primary" onclick="approvePayment()">Approve Payment</button>
            </div>
            <div id="approveAlert" class="alert"></div>
        </div>

    </div>

    <script>
    // Update navbar and welcome banner
    fetch('/auth/user')
        .then(res => res.json())
        .then(user => {
            const nav = document.getElementById('navLinks');
            if (user) {
                nav.innerHTML = `
                    <a href="/tutors-page">Tutors</a>
                    <a href="/booking-page">Book</a>
                    <a href="/payment-page">Payment</a>
                    <a href="/dashboard">
                        <img src="${user.picture}" style="width:32px;height:32px;border-radius:50%;margin-left:2rem;vertical-align:middle;border:2px solid #e94560;">
                        <span style="color:white;margin-left:0.5rem;font-size:0.9rem;">${user.name.split(' ')[0]}</span>
                    </a>
                    <a href="/auth/logout" class="btn-nav" style="margin-left:1rem;">Logout</a>
                `;

                // Show welcome banner
                document.getElementById('welcomeBanner').style.display = 'flex';
                document.getElementById('userAvatar').src = user.picture;
                document.getElementById('welcomeName').textContent = `Welcome back, ${user.name.split(' ')[0]}!`;
                document.getElementById('welcomeEmail').textContent = user.email;
            } else {
                window.location.href = '/auth/login';
            }
        });

    function loadBookings() {
        fetch("/bookings")
            .then(res => res.json())
            .then(data => {
                let tbody = document.getElementById("bookingsTable");
                document.getElementById("totalBookings").textContent = data.length;
                document.getElementById("pendingCount").textContent = data.filter(b => b[5] === 'pending').length;
                document.getElementById("approvedCount").textContent = data.filter(b => b[5] !== 'pending').length;

                if (data.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="6" style="color: #999; text-align: center;">No bookings yet.</td></tr>';
                    return;
                }

                tbody.innerHTML = data.map(b => `
                    <tr>
                        <td>#${b[0]}</td>
                        <td>${b[1]}</td>
                        <td>${b[2]}</td>
                        <td>${b[3]}</td>
                        <td>${b[4]}</td>
                        <td><span class="badge ${b[5] === 'pending' ? 'badge-pending' : 'badge-approved'}">${b[5]}</span></td>
                    </tr>
                `).join('');
            });
    }

    function approvePayment() {
        fetch("/payment/offline", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({
                booking_id: document.getElementById("booking_id").value
            })
        })
        .then(res => res.json())
        .then(data => {
            let alert = document.getElementById("approveAlert");
            alert.style.display = "block";
            alert.className = "alert alert-success";
            alert.textContent = "✓ " + data.message;
            loadBookings();
        });
    }

    loadBookings();
    </script>

</body>
</html>
