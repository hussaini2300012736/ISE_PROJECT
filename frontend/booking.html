<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book a Session — TutorBook</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        :root {
            --primary: #1a1a2e;
            --accent: #e94560;
            --light: #f5f5f0;
            --muted: #6c757d;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'DM Sans', sans-serif;
            background: var(--light);
            color: var(--primary);
            min-height: 100vh;
        }

        nav {
            background: var(--primary);
            padding: 1.2rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .nav-logo {
            font-family: 'Playfair Display', serif;
            color: white;
            font-size: 1.5rem;
            text-decoration: none;
        }

        .nav-logo span { color: var(--accent); }

        .nav-links a {
            color: rgba(255,255,255,0.75);
            text-decoration: none;
            margin-left: 2rem;
            font-size: 0.95rem;
            font-weight: 500;
            transition: color 0.2s;
        }

        .nav-links a:hover, .nav-links a.active { color: white; }

        .nav-links .btn-nav {
            background: var(--accent);
            color: white;
            padding: 0.5rem 1.3rem;
            border-radius: 50px;
        }

        .page-header {
            background: var(--primary);
            padding: 3rem 3rem 4rem;
            position: relative;
            overflow: hidden;
        }

        .page-header::before {
            content: '';
            position: absolute;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(233,69,96,0.15) 0%, transparent 70%);
            top: -100px;
            right: 0;
            border-radius: 50%;
        }

        .page-header h1 {
            font-family: 'Playfair Display', serif;
            color: white;
            font-size: 2.5rem;
            position: relative;
        }

        .page-header p {
            color: rgba(255,255,255,0.5);
            margin-top: 0.5rem;
            position: relative;
        }

        .main-content {
            padding: 2.5rem 3rem;
            max-width: 700px;
            margin: 0 auto;
        }

        .booking-card {
            background: white;
            border-radius: 20px;
            padding: 2.5rem;
            border: 1px solid #eee;
            animation: fadeUp 0.5s ease forwards;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .booking-card h3 {
            font-family: 'Playfair Display', serif;
            font-size: 1.6rem;
            margin-bottom: 0.5rem;
        }

        .booking-card .subtitle {
            color: var(--muted);
            font-size: 0.9rem;
            margin-bottom: 2rem;
        }

        .form-group {
            margin-bottom: 1.2rem;
        }

        label {
            display: block;
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--primary);
            margin-bottom: 0.4rem;
        }

        input, select {
            width: 100%;
            padding: 0.85rem 1rem;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-family: 'DM Sans', sans-serif;
            font-size: 0.95rem;
            color: var(--primary);
            background: var(--light);
            transition: border-color 0.2s;
            outline: none;
        }

        input:focus, select:focus {
            border-color: var(--accent);
            background: white;
        }

        .btn-submit {
            width: 100%;
            padding: 1rem;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 12px;
            font-family: 'DM Sans', sans-serif;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            margin-top: 0.5rem;
            transition: all 0.3s;
        }

        .btn-submit:hover {
            background: #c73652;
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(233,69,96,0.25);
        }

        .alert {
            padding: 1rem 1.2rem;
            border-radius: 10px;
            font-size: 0.9rem;
            margin-top: 1rem;
            display: none;
        }

        .alert-success { background: #d4edda; color: #155724; border-left: 3px solid #28a745; }
        .alert-error { background: #f8d7da; color: #721c24; border-left: 3px solid var(--accent); }

        .info-box {
            background: var(--light);
            border-radius: 12px;
            padding: 1.2rem 1.5rem;
            margin-bottom: 2rem;
            display: flex;
            gap: 1rem;
            align-items: flex-start;
        }

        .info-box i {
            color: var(--accent);
            font-size: 1.2rem;
            margin-top: 0.1rem;
        }

        .info-box p {
            font-size: 0.85rem;
            color: var(--muted);
            line-height: 1.6;
        }
    </style>
</head>
<body>

    <nav>
        <a href="index.html" class="nav-logo">Tutor<span>Book</span></a>
        <div class="nav-links">
            <a href="tutors.html">Tutors</a>
            <a href="booking.html" class="active">Book</a>
            <a href="payment.html">Payment</a>
            <a href="login.html" class="btn-nav">Login</a>
        </div>
    </nav>

    <div class="page-header">
        <h1>Book a Session</h1>
        <p>Choose your tutor, pick a date and time, and confirm your booking</p>
    </div>

    <div class="main-content">
        <div class="booking-card">
            <h3>Session Details</h3>
            <p class="subtitle">Fill in your details to book a tutoring session</p>

            <div class="info-box">
                <i class="bi bi-info-circle"></i>
                <p>You can find tutor IDs on the <a href="tutors.html" style="color: var(--accent);">Tutors page</a>. Make sure the tutor is available at your chosen time.</p>
            </div>

            <div class="form-group">
                <label>Your Name</label>
                <input id="student_name" placeholder="Enter your full name">
            </div>

            <div class="form-group">
                <label>Tutor ID</label>
                <input id="tutor_id" placeholder="e.g. 4" type="number">
            </div>

            <div class="form-group">
                <label>Date</label>
                <input id="date" type="date">
            </div>

            <div class="form-group">
                <label>Time</label>
                <input id="time" placeholder="e.g. 14:00">
            </div>

            <button class="btn-submit" onclick="bookTutor()">
                <i class="bi bi-calendar-check"></i> Confirm Booking
            </button>

            <div id="bookingAlert" class="alert"></div>
        </div>
    </div>

    <script>
    function bookTutor() {
        fetch("http://127.0.0.1:5000/book", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({
                student_name: document.getElementById("student_name").value,
                tutor_id: document.getElementById("tutor_id").value,
                date: document.getElementById("date").value,
                time: document.getElementById("time").value
            })
        })
        .then(res => res.json())
        .then(data => {
            let alert = document.getElementById("bookingAlert");
            alert.style.display = "block";
            if (data.message) {
                alert.className = "alert alert-success";
                alert.textContent = "✓ " + data.message;
            } else {
                alert.className = "alert alert-error";
                alert.textContent = "✗ " + (data.error || "Something went wrong");
            }
        });
    }
    </script>

</body>
</html>
